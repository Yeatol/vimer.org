<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>LittleJS Demo</title>
  <style>
    :root {
      color-scheme: dark;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #020817;
      font-family: Inter, "Segoe UI", sans-serif;
    }
    body {
      padding: 0;
      box-sizing: border-box;
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      max-width: none;
      max-height: none;
      image-rendering: auto;
      touch-action: none;
      background: #020817;
    }
  </style>
</head>
<body>
  <script src="./littlejs.js"></script>
  <script>
    function drawGuideFrame() {
      const halfW = 18;
      const halfH = 10;
      const outside = 0.5;

      drawRect(vec2(0, 0), vec2(36, 20), rgb(0.03, 0.05, 0.09, 1));
      drawRect(vec2(0, 0), vec2(36 - outside * 2, 20 - outside * 2), rgb(0.12, 0.15, 0.18, 1), 0, false);

      drawLine(vec2(-halfW, -halfH), vec2(halfW, -halfH), 0.22, rgb(1, 1, 1, 0.9));
      drawLine(vec2(-halfW, halfH), vec2(halfW, halfH), 0.22, rgb(1, 1, 1, 0.9));
      drawLine(vec2(-halfW, -halfH), vec2(-halfW, halfH), 0.22, rgb(1, 1, 1, 0.9));
      drawLine(vec2(halfW, -halfH), vec2(halfW, halfH), 0.22, rgb(1, 1, 1, 0.9));

      drawLine(vec2(-halfW, 0), vec2(halfW, 0), 0.1, rgb(0.42, 0.82, 1, 0.8));
      drawLine(vec2(0, -halfH), vec2(0, halfH), 0.1, rgb(0.42, 0.82, 1, 0.8));
    }

    function drawArrowCenter() {
      const x = 0;
      const y = 0;
      const body = 4.2;
      const wing = 1.8;

      drawLine(vec2(x, y + 2), vec2(x, y - body), 0.4, rgb(1, 0.95, 0.7, 1));
      drawLine(vec2(x - wing, y - 0.8), vec2(x, y - body), 0.4, rgb(1, 0.95, 0.7, 1));
      drawLine(vec2(x + wing, y - 0.8), vec2(x, y - body), 0.4, rgb(1, 0.95, 0.7, 1));
      drawCircle(vec2(x, y + 1), 1, rgb(0.38, 0.82, 1, 0.8));
    }

    function drawSafeAreaMarkers() {
      const r = 12.5;
      drawLine(vec2(-r, -r), vec2(-r + 2.8, -r), 0.18, rgb(0.8, 0.9, 1, 0.9));
      drawLine(vec2(-r, -r), vec2(-r, -r + 2.8), 0.18, rgb(0.8, 0.9, 1, 0.9));
      drawLine(vec2(r, -r), vec2(r - 2.8, -r), 0.18, rgb(0.8, 0.9, 1, 0.9));
      drawLine(vec2(r, -r), vec2(r, -r + 2.8), 0.18, rgb(0.8, 0.9, 1, 0.9));
      drawLine(vec2(-r, r), vec2(-r + 2.8, r), 0.18, rgb(0.8, 0.9, 1, 0.9));
      drawLine(vec2(-r, r), vec2(-r, r - 2.8), 0.18, rgb(0.8, 0.9, 1, 0.9));
      drawLine(vec2(r, r), vec2(r - 2.8, r), 0.18, rgb(0.8, 0.9, 1, 0.9));
      drawLine(vec2(r, r), vec2(r, r - 2.8), 0.18, rgb(0.8, 0.9, 1, 0.9));
    }

    function gameInit() {
      // minimal static checker
    }

    function gameUpdate() {
      // no animation needed
    }

    function gameRender() {
      drawGuideFrame();
      drawSafeAreaMarkers();
      drawArrowCenter();
    }

    function gameRenderPost() {
      drawTextScreen('mobile viewport check', vec2(0, -140), 28, rgb(1, 1, 1, 0.9));
    }

    engineInit(gameInit, gameUpdate, null, gameRender, gameRenderPost);
  </script>
</body>
</html>
