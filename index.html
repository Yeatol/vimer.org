<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>LittleJS Demo</title>
  <style>
    :root {
      color-scheme: dark;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #020817;
      font-family: Inter, "Segoe UI", sans-serif;
    }
    body {
      padding: 0;
      box-sizing: border-box;
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      max-width: none;
      max-height: none;
      image-rendering: auto;
      touch-action: none;
      background: #020817;
    }
  </style>
</head>
<body>
  <script src="./littlejs.js"></script>
  <script>
    function drawGuideFrame() {
      const halfW = 18;
      const halfH = 10;
      const edge = 0.3;

      drawRect(vec2(0, 0), vec2(36, 20), rgb(0.06, 0.08, 0.12, 1));
      drawRect(vec2(0, 0), vec2(36 - edge * 2, 20 - edge * 2), rgb(0.12, 0.18, 0.22, 1), 0, false);

      drawLine(vec2(-halfW, -halfH), vec2(halfW, -halfH), 0.18, rgb(0.9, 0.9, 0.9, 0.8));
      drawLine(vec2(-halfW, halfH), vec2(halfW, halfH), 0.18, rgb(0.9, 0.9, 0.9, 0.8));
      drawLine(vec2(-halfW, -halfH), vec2(-halfW, halfH), 0.18, rgb(0.9, 0.9, 0.9, 0.8));
      drawLine(vec2(halfW, -halfH), vec2(halfW, halfH), 0.18, rgb(0.9, 0.9, 0.9, 0.8));

      drawLine(vec2(-halfW, 0), vec2(halfW, 0), 0.12, rgb(1, 0.5, 0.3, 0.8));
      drawLine(vec2(0, -halfH), vec2(0, halfH), 0.12, rgb(1, 0.5, 0.3, 0.8));
    }

    function drawArrowCenter() {
      const x = 0;
      const y = 0;
      const body = 3.2;
      const wings = 1.2;

      drawLine(vec2(x, y + 2.4), vec2(x, y - body), 0.4, rgb(1, 0.95, 0.7, 1));
      drawLine(vec2(x - wings, y - 0.6), vec2(x, y - body), 0.4, rgb(1, 0.95, 0.7, 1));
      drawLine(vec2(x + wings, y - 0.6), vec2(x, y - body), 0.4, rgb(1, 0.95, 0.7, 1));
      drawCircle(vec2(x, y + 0.5), 0.9, rgb(0.4, 0.9, 1, 0.8));
    }

    function gameInit() {
      // no-op: this demo is intentionally minimal for responsive checking
    }

    function gameUpdate() {
      // no-op: static frame for layout verification
    }

    function gameRender() {
      drawGuideFrame();
      drawArrowCenter();
    }

    function gameRenderPost() {
      drawTextScreen('responsive check', vec2(0, -140), 28, rgb(1, 1, 1, 0.9));
    }

    engineInit(gameInit, gameUpdate, null, gameRender, gameRenderPost);
  </script>
</body>
</html>
