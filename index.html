<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>LittleJS Demo</title>
  <style>
    :root {
      color-scheme: dark;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #020817;
      font-family: Inter, "Segoe UI", sans-serif;
    }
    body {
      padding: 0;
      box-sizing: border-box;
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      max-width: none;
      max-height: none;
      image-rendering: auto;
      touch-action: none;
      background: #020817;
    }
  </style>
</head>
<body>
  <script src="./littlejs.js"></script>
  <script>
    function drawGuideFrame() {
      const halfW = 18;
      const halfH = 10;
      const edge = 0.4;

      drawRect(vec2(0, 0), vec2(36, 20), rgb(0.04, 0.06, 0.1, 1));
      drawRect(vec2(0, 0), vec2(36 - edge * 2, 20 - edge * 2), rgb(0.12, 0.16, 0.2, 1), 0, false);

      drawLine(vec2(-halfW, -halfH), vec2(halfW, -halfH), 0.24, rgb(1, 0.95, 0.75, 0.9));
      drawLine(vec2(-halfW, halfH), vec2(halfW, halfH), 0.24, rgb(1, 0.95, 0.75, 0.9));
      drawLine(vec2(-halfW, -halfH), vec2(-halfW, halfH), 0.24, rgb(1, 0.95, 0.75, 0.9));
      drawLine(vec2(halfW, -halfH), vec2(halfW, halfH), 0.24, rgb(1, 0.95, 0.75, 0.9));

      drawLine(vec2(-halfW, 0), vec2(halfW, 0), 0.12, rgb(0.45, 0.9, 1, 0.8));
      drawLine(vec2(0, -halfH), vec2(0, halfH), 0.12, rgb(0.45, 0.9, 1, 0.8));

      drawLine(vec2(-halfW + 1.5, -halfH + 1.5), vec2(halfW - 1.5, -halfH + 1.5), 0.08, rgb(1, 0.5, 0.5, 0.8));
      drawLine(vec2(-halfW + 1.5, halfH - 1.5), vec2(halfW - 1.5, halfH - 1.5), 0.08, rgb(1, 0.5, 0.5, 0.8));
      drawLine(vec2(-halfW + 1.5, -halfH + 1.5), vec2(-halfW + 1.5, halfH - 1.5), 0.08, rgb(1, 0.5, 0.5, 0.8));
      drawLine(vec2(halfW - 1.5, -halfH + 1.5), vec2(halfW - 1.5, halfH - 1.5), 0.08, rgb(1, 0.5, 0.5, 0.8));
    }

    function drawArrowCenter() {
      const x = 0;
      const y = 0;
      const body = 3.5;
      const wings = 1.4;

      drawLine(vec2(x, y + 2.1), vec2(x, y - body), 0.42, rgb(1, 0.95, 0.7, 1));
      drawLine(vec2(x - wings, y - 0.7), vec2(x, y - body), 0.42, rgb(1, 0.95, 0.7, 1));
      drawLine(vec2(x + wings, y - 0.7), vec2(x, y - body), 0.42, rgb(1, 0.95, 0.7, 1));
      drawCircle(vec2(x, y + 0.9), 0.95, rgb(0.38, 0.82, 1, 0.75));
    }

    function drawCornerMarks() {
      const r = 13;
      drawLine(vec2(-r, -r), vec2(-r + 2.5, -r), 0.2, rgb(0.9, 0.9, 1, 0.9));
      drawLine(vec2(-r, -r), vec2(-r, -r + 2.5), 0.2, rgb(0.9, 0.9, 1, 0.9));
      drawLine(vec2(r, -r), vec2(r - 2.5, -r), 0.2, rgb(0.9, 0.9, 1, 0.9));
      drawLine(vec2(r, -r), vec2(r, -r + 2.5), 0.2, rgb(0.9, 0.9, 1, 0.9));
      drawLine(vec2(-r, r), vec2(-r + 2.5, r), 0.2, rgb(0.9, 0.9, 1, 0.9));
      drawLine(vec2(-r, r), vec2(-r, r - 2.5), 0.2, rgb(0.9, 0.9, 1, 0.9));
      drawLine(vec2(r, r), vec2(r - 2.5, r), 0.2, rgb(0.9, 0.9, 1, 0.9));
      drawLine(vec2(r, r), vec2(r, r - 2.5), 0.2, rgb(0.9, 0.9, 1, 0.9));
    }

    function gameInit() {
      // minimal static checker
    }

    function gameUpdate() {
      // no animation needed
    }

    function gameRender() {
      drawGuideFrame();
      drawCornerMarks();
      drawArrowCenter();
    }

    function gameRenderPost() {
      drawTextScreen('viewport check', vec2(0, -135), 28, rgb(1, 1, 1, 0.9));
    }

    engineInit(gameInit, gameUpdate, null, gameRender, gameRenderPost);
  </script>
</body>
</html>
