<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>LittleJS Demo</title>
  <style>
    :root {
      color-scheme: dark;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #020817;
      font-family: Inter, "Segoe UI", sans-serif;
    }
    body {
      padding: 0;
      box-sizing: border-box;
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      max-width: none;
      max-height: none;
      image-rendering: auto;
      touch-action: none;
      background: #020817;
    }
  </style>
</head>
<body>
  <script src="./littlejs.js"></script>
  <script>
    function drawGuideFrame() {
      const halfW = 18;
      const halfH = 10;
      const out = 0.7;

      drawRect(vec2(0, 0), vec2(36, 20), rgb(0, 0, 0, 1));
      drawRect(vec2(0, 0), vec2(36 - out * 2, 20 - out * 2), rgb(0.08, 0.08, 0.1, 1), 0, false);

      drawLine(vec2(-halfW, -halfH), vec2(halfW, -halfH), 0.25, rgb(1, 1, 1, 1));
      drawLine(vec2(-halfW, halfH), vec2(halfW, halfH), 0.25, rgb(1, 1, 1, 1));
      drawLine(vec2(-halfW, -halfH), vec2(-halfW, halfH), 0.25, rgb(1, 1, 1, 1));
      drawLine(vec2(halfW, -halfH), vec2(halfW, halfH), 0.25, rgb(1, 1, 1, 1));

      drawLine(vec2(-halfW, 0), vec2(halfW, 0), 0.12, rgb(1, 0.25, 0.25, 1));
      drawLine(vec2(0, -halfH), vec2(0, halfH), 0.12, rgb(1, 0.25, 0.25, 1));
    }

    function drawArrowCenter() {
      const x = 0;
      const y = 0;
      const body = 4.4;
      const wing = 2.0;

      drawLine(vec2(x, y + 2.1), vec2(x, y - body), 0.45, rgb(0.35, 0.8, 1, 1));
      drawLine(vec2(x - wing, y - 0.8), vec2(x, y - body), 0.45, rgb(0.35, 0.8, 1, 1));
      drawLine(vec2(x + wing, y - 0.8), vec2(x, y - body), 0.45, rgb(0.35, 0.8, 1, 1));
      drawCircle(vec2(x, y + 1.0), 1.1, rgb(0.35, 0.8, 1, 0.8));
    }

    function drawCornerMarks() {
      const r = 12.6;
      drawLine(vec2(-r, -r), vec2(-r + 2.8, -r), 0.18, rgb(1, 0.8, 0.5, 1));
      drawLine(vec2(-r, -r), vec2(-r, -r + 2.8), 0.18, rgb(1, 0.8, 0.5, 1));
      drawLine(vec2(r, -r), vec2(r - 2.8, -r), 0.18, rgb(1, 0.8, 0.5, 1));
      drawLine(vec2(r, -r), vec2(r, -r + 2.8), 0.18, rgb(1, 0.8, 0.5, 1));
      drawLine(vec2(-r, r), vec2(-r + 2.8, r), 0.18, rgb(1, 0.8, 0.5, 1));
      drawLine(vec2(-r, r), vec2(-r, r - 2.8), 0.18, rgb(1, 0.8, 0.5, 1));
      drawLine(vec2(r, r), vec2(r - 2.8, r), 0.18, rgb(1, 0.8, 0.5, 1));
      drawLine(vec2(r, r), vec2(r, r - 2.8), 0.18, rgb(1, 0.8, 0.5, 1));
    }

    function gameInit() {
      // minimal static checker
    }

    function gameUpdate() {
      // no animation needed
    }

    function gameRender() {
      drawGuideFrame();
      drawCornerMarks();
      drawArrowCenter();
    }

    function gameRenderPost() {
      drawTextScreen('max contrast viewport check', vec2(0, -140), 28, rgb(1, 1, 1, 0.9));
    }

    engineInit(gameInit, gameUpdate, null, gameRender, gameRenderPost);
  </script>
</body>
</html>
